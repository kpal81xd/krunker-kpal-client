<html>
	<head>
		<link rel="stylesheet" type="text/css" href="../css/prompt.css">
	</head>
	<body>
		<div id='promptMenu'>
			<div class='lineSpacing'>
				<a id="promptText">Question</a>
			</div>

			<div id="typeFrame" class='lineSpacing'>
				<select id="promptInput">
					<option value="index.html">Homepage</option>
					<option value="social.html">Social</option>
					<option value="viewer.html">Viewer</option>
					<option value="editor.html">Editor</option>
				</select><br>
			</div>

			<div class='lineSpacing'>
				<div class="actionButton" href='javascript:;' onclick="submit()">Submit</div>
				<div class="actionButton" href='javascript:;' onclick="cancel()">Cancel</div>
			</div>
		</div>
	</body>
	<script>
		const electron = require('electron');
		const config = new (require('electron-store'))();
		const { ipcRenderer, remote } = electron;

		const darkMode = () => {
			if (!config.get("tools_theme", false)) return;

			const sheet = document.styleSheets[0];

			const modifyRule = (query, property, value, priority) => {
				let rule = Object.values(sheet.rules).find(r => {
					return r.selectorText ? r.selectorText == query : false;
				});
				if (rule) {
					rule.style.setProperty(property, value, priority);
				}
			}

			modifyRule("#promptMenu", "background-color", "#333");
			modifyRule("#promptMenu", "box-shadow", "#222 0px 9px 0px 0px");

			modifyRule(".actionButton", "background-color", "#ff4747");

			modifyRule("*", "color", "#eee");

			modifyRule("input", "background-color", "#222");
			modifyRule("input", "border-color", "#222");
		}
		darkMode();

		ipcRenderer.on('text', (event, raw) => {
			const opt = JSON.parse(raw);
			promptText.innerText = `${opt.data}`;
			switch (opt.type) {
				case 'select':
					typeFrame.innerHTML = `
						<select id="promptInput">
							<option value=" ">Homepage</option>
							<option value="social.html">Social</option>
							<option value="viewer.html">Viewer</option>
							<option value="editor.html">Editor</option>
						</select><br>`
					break;
				case 'text':
				default:
					typeFrame.innerHTML = '<input id="promptInput" placeholder="Enter Input"><br>';
					break;
			}
			remote.getCurrentWindow().setBounds({
				height: promptMenu.getBoundingClientRect().height + 7
			});
		});

		const cancel = () => {
			window.close();
		}
		const submit = () => {
			ipcRenderer.send('prompt-response', promptInput.value);
			window.close();
		}
	</script>
</html>
