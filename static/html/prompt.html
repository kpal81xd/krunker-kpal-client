<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; style-src file: 'unsafe-inline'; font-src file:; img-src file:"
        />
        <title>Prompt</title>
        <link rel="stylesheet" type="text/css" href="../css/prompt.css" />
    </head>
    <body>
        <div id="promptMenu">
            <div class="lineSpacing">
                <a id="promptText">Question</a>
            </div>
            <div class="lineSpacing">
                <input id="promptInput" placeholder="Enter Input" />
            </div>
            <div class="lineSpacing">
                <div id="submit" class="actionButton">Submit</div>
                <div id="cancel" class="actionButton">Cancel</div>
            </div>
        </div>
    </body>
</html>
